# Front door for the default stack (ARCHITECTURE.md section 9).
#   :8080  round-robin across both gateways (one shared Redis quota)
#   :8081  Node gateway only
#   :8082  Go gateway only
#
# Gateways trust X-Forwarded-For only from this proxy's fixed address
# (TRUST_PROXY=172.28.0.10), so the header set here is the one they believe.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream node_gateway {
        server node:3000;
        keepalive 64;
    }

    upstream go_gateway {
        server go:3001;
        keepalive 64;
    }

    upstream both_gateways {
        server node:3000;
        server go:3001;
        keepalive 64;
    }

    # Name the backend that served a request; container IPs aren't meaningful
    # to a reader, but the listening port identifies the runtime.
    map $upstream_addr $served_by {
        ~:3000$  node;
        ~:3001$  go;
        default  $upstream_addr;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Appends the peer address to any client-supplied chain. Gateways walk
    # the chain from the right, so forged entries to the left are ignored.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header X-Served-By $served_by always;

    server {
        listen 8080;
        location / { proxy_pass http://both_gateways; }
    }

    server {
        listen 8081;
        location / { proxy_pass http://node_gateway; }
    }

    server {
        listen 8082;
        location / { proxy_pass http://go_gateway; }
    }
}
